name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Pz.Connector.Elasticsearch.slnx -c Release
      # ubuntu has docker, so the Testcontainers node facts run; windows cannot pull Linux images,
      # so it runs everything that is not node-backed.
      - if: runner.os == 'Linux'
        run: dotnet test Pz.Connector.Elasticsearch.slnx -c Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
      - if: runner.os == 'Windows'
        run: dotnet test Pz.Connector.Elasticsearch.slnx -c Release --no-build --filter "Category!=Docker" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

  # The other half of the proof: a stranger declares the connector by package id, runs `pz restore`,
  # and pz spawns the Native AOT binary. The suite above never touches pz's resolver, materializer
  # or process host; this job proves the AOT publish, the generated manifest and the PCP handshake
  # fit together against the released pz, with a live node on both ends.
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the host RID (Native AOT) and pack
        run: |
          set -euo pipefail
          # A separate `restore -r` before `publish -r --no-restore` is required on a cold NuGet
          # cache: the restore folded into `publish -r` alone does not pull the RID-specific packs
          # this build needs (NETSDK1112), even though the same restore run standalone does.
          dotnet restore src/Pz.Connector.Elasticsearch -r linux-x64
          dotnet publish src/Pz.Connector.Elasticsearch -c Release -r linux-x64 --no-restore
          dotnet pack src/Pz.Connector.Elasticsearch -c Release -o packages
          ls packages
          VERSION="$(ls packages/Pz.Connector.Elasticsearch.*.nupkg | sed -E 's|.*/Pz\.Connector\.Elasticsearch\.(.*)\.nupkg|\1|')"
          echo "PKG_VERSION=${VERSION}" >> "$GITHUB_ENV"
          unzip -p "packages/Pz.Connector.Elasticsearch.${VERSION}.nupkg" pz.connector.json | tee manifest.json
          grep -q '"runtime": "process"' manifest.json
          grep -q '"name": "elasticsearch"' manifest.json
          grep -q '"projectDirectoryAnchor": true' manifest.json
          for cap in ColumnPruning BoundedWindow InclusiveWatermarkBound Merge ReplaceWrites; do
            grep -q "\"${cap}\"" manifest.json
          done
      - name: Start a node
        run: |
          set -euo pipefail
          docker run -d --name es -p 9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms1g -Xmx1g" elasticsearch:9.5.3
          for i in $(seq 1 120); do
            curl -sf http://localhost:9200/_cluster/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -X PUT http://localhost:9200/e2e-in -H 'Content-Type: application/json' \
            -d '{"mappings":{"properties":{"id":{"type":"long"},"name":{"type":"keyword"}}}}'
          printf '{"index":{"_id":"a"}}\n{"id":1,"name":"ann"}\n{"index":{"_id":"b"}}\n{"id":2,"name":"bob"}\n{"index":{"_id":"c"}}\n{"id":3,"name":"cy"}\n' \
            | curl -sf -X POST 'http://localhost:9200/e2e-in/_bulk?refresh=true' -H 'Content-Type: application/x-ndjson' --data-binary @-
      - name: Install pz, restore from the local feed, run, conformance-test
        env:
          ES_URL: http://localhost:9200
        run: |
          set -euo pipefail
          dotnet tool install --global pz --version 0.6.0
          cd tests/e2e
          sed -i "s/0.0.0-PLACEHOLDER/${PKG_VERSION}/" project.yml
          pz restore --feeds "${GITHUB_WORKSPACE}/packages"
          PKG_DIR=".pz/packages/Pz.Connector.Elasticsearch/${PKG_VERSION}"
          test -f "${PKG_DIR}/native/Pz.Connector.Elasticsearch"
          pz run
          # Three documents in, three documents out, ids carried along.
          curl -sf 'http://localhost:9200/e2e-out/_search?size=10' | tee out.json
          test "$(python3 -c "import json;print(json.load(open('out.json'))['hits']['total']['value'])")" -eq 3
          grep -q '"source_id":"b"' out.json
          grep -q '"name":"bob"' out.json
          # Append is at-least-once: a second run lands the three again and stays green.
          pz run
          test "$(curl -sf 'http://localhost:9200/e2e-out/_count' | python3 -c "import json,sys;print(json.load(sys.stdin)['count'])")" -eq 6
          pz connector test "${PKG_DIR}" --config probe.yml | tee report.txt
          ! grep -q FAIL report.txt
